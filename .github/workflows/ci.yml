name: CI и деплой

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# один деплой за раз; новый push не обрывает уже идущую публикацию
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      # Pages отдаёт проект из подкаталога /<репозиторий>/ — ассеты и шрифты
      # (импорты `?url`) Vite строит от base, поэтому он задаётся при сборке
      - run: npm run build -- --base=/${{ github.event.repository.name }}/
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: check
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
